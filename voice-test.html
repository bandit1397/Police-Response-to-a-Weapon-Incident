<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>음성 변환 시험판</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1a1f27;--mut:#5b6573;--line:#d5dae1;--c:#1f5fbf;--ban:#b3261e;--banbg:#fdecea}
@media(prefers-color-scheme:dark){:root{--bg:#10141a;--card:#1a2029;--ink:#e8ecf1;--mut:#a3adba;--line:#333c48;--c:#7fb0f5;--ban:#ff9c94;--banbg:#3a1d1b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Malgun Gothic",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0}
h2{font-size:16px;margin:0 0 8px}
p{margin:6px 0}
.note{background:var(--banbg);color:var(--ban);font-weight:700;border-radius:8px;padding:8px 10px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px}
label{display:block;font-size:14px;color:var(--mut);margin-top:8px}
select,button{width:100%;min-height:48px;font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px}
button{margin-top:10px;font-weight:700;cursor:pointer;border:2px solid var(--c)}
button:disabled{opacity:.45;cursor:default}
#rec.on{background:var(--ban);border-color:var(--ban);color:#fff}
progress{width:100%;margin-top:8px}
progress[hidden]{display:none}
.mut{color:var(--mut);font-size:14px}
.err{color:var(--ban);font-weight:700}
#text{min-height:96px;font-size:18px;white-space:pre-wrap}
#mid{color:var(--mut)}
</style>
</head>
<body>
<main>
 <h1>음성 변환 시험판</h1>
 <p class="note">초안 시험용입니다. 공식 기능이 아니며 실제 사건 내용은 말하지 마세요. 변환 결과는 틀릴 수 있습니다.</p>
 <p class="mut">음성은 이 휴대폰 안에서만 글자로 바뀝니다. 인터넷은 처음에 모델 파일을 받을 때만 씁니다.</p>

 <section class="card">
  <h2>1. 모델 받기</h2>
  <p class="mut">Wi-Fi에서 받으세요. 한 번 받으면 다음부터는 대부분 다시 받지 않습니다.</p>
  <label for="model">모델</label>
  <select id="model">
   <option value="tiny/q8">가장 빠름 (약 28MB)</option>
   <option value="base/q8" selected>보통 (약 64MB)</option>
   <option value="base/fp32">가장 정확 (약 247MB, 휴대폰이 느리거나 멈출 수 있음)</option>
  </select>
  <button id="load" type="button">모델 받기</button>
  <progress id="bar" max="100" value="0" hidden></progress>
  <p id="loadMsg" class="mut" role="status"></p>
 </section>

 <section class="card">
  <h2>2. 말하기</h2>
  <p class="mut">말하는 동안 글자가 나옵니다. 흐린 글자는 아직 고쳐질 수 있는 글자입니다.</p>
  <button id="rec" type="button" disabled>녹음 시작</button>
  <p id="recMsg" class="mut" role="status"></p>
  <div id="text"><span id="fin"></span><span id="mid"></span></div>
  <p id="stat" class="mut"></p>
 </section>
 <p class="mut" id="ua"></p>
</main>
<script>
(function(){
 var $=function(id){return document.getElementById(id)};
 var RATE=16000,MIN=3*RATE,MAX=9*RATE,STEP=RATE,QUIET=.008;
 var worker=null,loaded=false,loading=false,running=false,working=false;
 var ctx=null,src=null,proc=null,stream=null,timer=null,t0=0;
 var buf=new Float32Array(MAX+RATE),len=0,sent=0,seg=0,queue=[],stopAt=0,total=0,net=0,files={};
 $('ua').textContent='기기 정보: '+navigator.userAgent;
 window.addEventListener('error',function(e){fail('오류: '+e.message)});
 window.addEventListener('unhandledrejection',function(e){fail('오류: '+(e.reason&&e.reason.message||e.reason))});

 function msg(id,t,err){$(id).textContent=t;$(id).className=err?'err':'mut'}
 function refresh(){$('rec').disabled=!loaded||!!stopAt;$('load').disabled=loading||running}
 function fail(t){
  loading=false;working=false;queue=[];stopAt=0;$('bar').hidden=true;
  if(running)stop();
  stopAt=0;queue=[];refresh();msg(loaded?'recMsg':'loadMsg',t,true);
 }
 function rms(a,from,to){var s=0;for(var i=from;i<to;i++)s+=a[i]*a[i];return Math.sqrt(s/Math.max(1,to-from))}
 function loud(a){
  for(var i=0;i+1600<=a.length;i+=1600)if(rms(a,i,i+1600)>QUIET)return true;
  return false;
 }
 function pump(){
  if(working)return;
  var job=null;
  if(queue.length)job=queue.shift();
  else if(running&&len>=STEP&&len-sent>=STEP){
   sent=len;var a=buf.slice(0,len);
   if(loud(a))job={audio:a,id:seg,final:false};
  }
  if(job){working=true;worker.postMessage({type:'run',audio:job.audio,id:job.id,final:job.final},[job.audio.buffer])}
  else if(stopAt&&!queue.length)done();
 }
 function done(){
  var lag=(Date.now()-stopAt)/1000;stopAt=0;$('mid').textContent='';refresh();
  msg('recMsg','완료. 말을 끝낸 뒤 '+lag.toFixed(1)+'초 만에 글자가 완성됐습니다.');
  $('stat').textContent='음성 '+(total/RATE).toFixed(1)+'초 · 변환 중 네트워크 요청 '+net+'건';
 }
 function cutAt(n){
  var a=buf.slice(0,n);seg++;
  if(loud(a))queue.push({audio:a,id:seg-1,final:true});
  buf.copyWithin(0,n,len);len-=n;sent=0;$('mid').textContent='';
 }
 function feed(x){
  if(len+x.length>buf.length)return;
  buf.set(x,len);len+=x.length;total+=x.length;
  var w=Math.round(.5*RATE);
  if(len>=MIN&&rms(buf,len-w,len)<.15*rms(buf,0,len-w))cutAt(len-Math.round(w/2));
  else if(len>=MAX){
   var best=len,low=1e9;
   for(var i=len-MIN;i+1600<=len;i+=800){var r=rms(buf,i,i+1600);if(r<low){low=r;best=i+800}}
   cutAt(best);
  }
  pump();
 }
 function startWorker(){
  if(worker)worker.terminate();
  worker=new Worker('voice-worker.js',{type:'module'});
  worker.onerror=function(e){loaded=false;fail('처리가 중단되었습니다. 휴대폰 메모리가 부족할 수 있으니 더 작은 모델로 시험하세요. '+(e.message||''))};
  worker.onmessage=function(e){
   var m=e.data;
   if(m.type==='progress'){
    files[m.file]=[m.loaded,m.total];
    var a=0,b=0;Object.keys(files).forEach(function(k){a+=files[k][0];b+=files[k][1]});
    $('bar').value=b?a/b*100:0;msg('loadMsg','받는 중 '+Math.round(a/1e6)+' / '+Math.round(b/1e6)+'MB');
   }else if(m.type==='ready'){
    loaded=true;loading=false;$('bar').hidden=true;refresh();
    msg('loadMsg','준비 완료 ('+(m.ms/1000).toFixed(1)+'초). 이제 말할 수 있습니다.');
   }else if(m.type==='done'){
    working=false;net+=m.net;
    if(m.final)$('fin').textContent+=(m.text?m.text+' ':'');
    else if(m.id===seg)$('mid').textContent=m.text;
    pump();
   }else if(m.type==='error')fail('오류: '+m.message);
  };
 }
 function stop(){
  running=false;clearInterval(timer);
  proc.disconnect();src.disconnect();stream.getTracks().forEach(function(t){t.stop()});ctx.close();
  $('rec').classList.remove('on');$('rec').textContent='녹음 시작';
 }
 $('load').onclick=function(){
  var v=$('model').value.split('/');
  loaded=false;loading=true;files={};refresh();$('bar').hidden=false;$('bar').value=0;msg('loadMsg','준비 중입니다.');
  startWorker();worker.postMessage({type:'load',size:v[0],dtype:v[1]});
 };
 $('rec').onclick=function(){
  if(running){
   stop();stopAt=Date.now();refresh();msg('recMsg','마무리 중입니다.');
   if(len>=1600)cutAt(len);else{len=0;sent=0}
   pump();return;
  }
  var C=window.AudioContext||window.webkitAudioContext;
  ctx=new C({sampleRate:RATE});ctx.resume();
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
   stream=st;src=ctx.createMediaStreamSource(st);proc=ctx.createScriptProcessor(2048,1,1);
   proc.onaudioprocess=function(e){if(running)feed(new Float32Array(e.inputBuffer.getChannelData(0)))};
   src.connect(proc);proc.connect(ctx.destination);
   len=0;sent=0;seg=0;queue=[];total=0;net=0;$('fin').textContent='';$('mid').textContent='';$('stat').textContent='';
   running=true;t0=Date.now();refresh();$('rec').classList.add('on');$('rec').textContent='녹음 끝내기';
   msg('recMsg','듣는 중 0초');
   timer=setInterval(function(){msg('recMsg','듣는 중 '+Math.floor((Date.now()-t0)/1000)+'초')},1000);
  }).catch(function(e){ctx.close();msg('recMsg','마이크를 쓸 수 없습니다('+e.name+').',true)});
 };
})();
</script>
</body>
</html>
