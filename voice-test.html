<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>음성 변환 시험판</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1a1f27;--mut:#5b6573;--line:#d5dae1;--c:#1f5fbf;--ban:#b3261e;--banbg:#fdecea}
@media(prefers-color-scheme:dark){:root{--bg:#10141a;--card:#1a2029;--ink:#e8ecf1;--mut:#a3adba;--line:#333c48;--c:#7fb0f5;--ban:#ff9c94;--banbg:#3a1d1b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Malgun Gothic",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0}
h2{font-size:16px;margin:0 0 8px}
p{margin:6px 0}
.note{background:var(--banbg);color:var(--ban);font-weight:700;border-radius:8px;padding:8px 10px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px}
label{display:block;font-size:14px;color:var(--mut);margin-top:8px}
select,button{width:100%;min-height:48px;font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px}
button{margin-top:10px;font-weight:700;cursor:pointer;border:2px solid var(--c)}
button:disabled{opacity:.45;cursor:default}
#rec.on{background:var(--ban);border-color:var(--ban);color:#fff}
progress{width:100%;margin-top:8px}
progress[hidden]{display:none}
.mut{color:var(--mut);font-size:14px}
.err{color:var(--ban);font-weight:700}
.item{border-top:1px solid var(--line);padding:8px 0}
.item:first-child{border-top:0}
.item b{display:block;white-space:pre-wrap;font-weight:500}
</style>
</head>
<body>
<main>
 <h1>음성 변환 시험판</h1>
 <p class="note">초안 시험용입니다. 공식 기능이 아니며 실제 사건 내용은 말하지 마세요. 변환 결과는 틀릴 수 있습니다.</p>
 <p class="mut">음성은 이 휴대폰 안에서만 글자로 바뀝니다. 인터넷은 처음에 모델 파일을 받을 때만 씁니다.</p>

 <section class="card">
  <h2>1. 모델 받기</h2>
  <p class="mut">Wi-Fi에서 받으세요. 한 번 받으면 다음부터는 대부분 다시 받지 않습니다.</p>
  <label for="size">모델</label>
  <select id="size">
   <option value="tiny">가장 빠름 (약 41MB)</option>
   <option value="base" selected>보통 (약 77MB)</option>
   <option value="small">가장 정확 (약 249MB, 휴대폰이 느리거나 멈출 수 있음)</option>
  </select>
  <label for="device">처리 방식</label>
  <select id="device"><option value="wasm">기본</option><option value="webgpu">그래픽 칩 사용 (더 빠를 수 있음)</option></select>
  <button id="load" type="button">모델 받기</button>
  <progress id="bar" max="100" value="0" hidden></progress>
  <p id="loadMsg" class="mut" role="status"></p>
 </section>

 <section class="card">
  <h2>2. 말하고 변환하기</h2>
  <p class="mut">모델을 받은 뒤 비행기 모드를 켜고 시험하면, 인터넷 없이 이 휴대폰에서만 변환되는지 직접 확인할 수 있습니다.</p>
  <button id="rec" type="button" disabled>녹음 시작</button>
  <p id="recMsg" class="mut" role="status"></p>
 </section>

 <section class="card">
  <h2>3. 결과</h2>
  <div id="out"><p class="mut">아직 결과가 없습니다.</p></div>
 </section>
 <p class="mut" id="ua"></p>
</main>
<script>
(function(){
 var $=function(id){return document.getElementById(id)};
 var worker=null,loaded=false,busy=false,mr=null,stream=null,t0=0,timer=null,wait=null,audioSec=0,files={};
 $('ua').textContent='기기 정보: '+navigator.userAgent;
 window.addEventListener('error',function(e){fail('오류: '+e.message)});
 window.addEventListener('unhandledrejection',function(e){fail('오류: '+(e.reason&&e.reason.message||e.reason))});
 if(!navigator.gpu)$('device').options[1].disabled=true;

 function msg(id,t,err){$(id).textContent=t;$(id).className=err?'err':'mut'}
 function refresh(){$('rec').disabled=!loaded||busy;$('load').disabled=busy}
 function fail(t){
  clearInterval(wait);busy=false;refresh();$('bar').hidden=true;
  msg(loaded?'recMsg':'loadMsg',t,true);
 }
 function startWorker(){
  if(worker)worker.terminate();
  worker=new Worker('voice-worker.js',{type:'module'});
  worker.onerror=function(e){loaded=false;fail('처리가 중단되었습니다. 휴대폰 메모리가 부족할 수 있으니 더 작은 모델로 시험하세요. '+(e.message||''))};
  worker.onmessage=function(e){
   var m=e.data;
   if(m.type==='progress'){
    files[m.file]=[m.loaded,m.total];
    var a=0,b=0;Object.keys(files).forEach(function(k){a+=files[k][0];b+=files[k][1]});
    $('bar').value=b?a/b*100:0;msg('loadMsg','받는 중 '+Math.round(a/1e6)+' / '+Math.round(b/1e6)+'MB');
   }else if(m.type==='ready'){
    loaded=true;busy=false;$('bar').hidden=true;refresh();
    msg('loadMsg','준비 완료 ('+(m.ms/1000).toFixed(1)+'초). 이제 녹음할 수 있습니다.');
   }else if(m.type==='done'){
    clearInterval(wait);busy=false;refresh();msg('recMsg','변환 완료');
    show(m);
   }else if(m.type==='error')fail('오류: '+m.message);
  };
 }
 function show(m){
  var box=$('out');if(box.querySelector('p'))box.textContent='';
  var d=document.createElement('div');d.className='item';
  var b=document.createElement('b');b.textContent=m.text||'(인식된 말이 없습니다)';
  var s=document.createElement('span');s.className='mut';
  s.textContent=$('size').selectedOptions[0].textContent.split(' (')[0]+' · 음성 '+audioSec.toFixed(1)+'초 · 변환 '+(m.ms/1000).toFixed(1)+'초 · 변환 중 네트워크 요청 '+m.net+'건';
  d.appendChild(b);d.appendChild(s);box.insertBefore(d,box.firstChild);
 }
 $('load').onclick=function(){
  loaded=false;busy=true;files={};refresh();$('bar').hidden=false;$('bar').value=0;msg('loadMsg','준비 중입니다.');
  startWorker();worker.postMessage({type:'load',size:$('size').value,device:$('device').value});
 };
 function finish(chunks,type){
  stream.getTracks().forEach(function(t){t.stop()});stream=null;
  busy=true;refresh();
  var w0=Date.now(),say=function(){msg('recMsg','글자로 바꾸는 중 '+Math.floor((Date.now()-w0)/1000)+'초. 화면을 켜 두세요.')};
  say();wait=setInterval(say,1000);
  new Blob(chunks,{type:type}).arrayBuffer().then(function(buf){
   var C=window.AudioContext||window.webkitAudioContext,ctx=new C({sampleRate:16000});
   return ctx.decodeAudioData(buf).then(function(a){ctx.close();return a});
  }).then(function(a){
   audioSec=a.duration;
   var pcm=a.getChannelData(0).slice();
   worker.postMessage({type:'run',audio:pcm},[pcm.buffer]);
  }).catch(function(e){fail('녹음을 읽지 못했습니다: '+e.message)});
 }
 $('rec').onclick=function(){
  if(mr){clearInterval(timer);mr.stop();mr=null;$('rec').classList.remove('on');$('rec').textContent='녹음 시작';return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
   stream=st;var chunks=[],r=new MediaRecorder(st);mr=r;
   r.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
   r.onstop=function(){finish(chunks,r.mimeType||'audio/webm')};
   r.start();t0=Date.now();$('rec').classList.add('on');$('rec').textContent='녹음 끝내고 변환';
   msg('recMsg','녹음 중 0초');
   timer=setInterval(function(){msg('recMsg','녹음 중 '+Math.floor((Date.now()-t0)/1000)+'초')},1000);
  }).catch(function(e){msg('recMsg','마이크를 쓸 수 없습니다('+e.name+').',true)});
 };
})();
</script>
</body>
</html>
