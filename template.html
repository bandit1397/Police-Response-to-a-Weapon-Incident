<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>{{TITLE}}</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#14181f;--mut:#5b6472;--line:#d6dbe2;--head:#10294a;--ban:#b3261e;--banbg:#fdecea;--talk:#0b5d8a;--talkbg:#e6f3fa;--done:#1b6e3c;--donebg:#e8f5ec;--rec:#5b4bc4;--dec:#8a5a00;--decbg:#fff4d6;--c:#1f5fbf}
html[data-theme=dark]{--bg:#0e1116;--card:#171b22;--ink:#e9ecf1;--mut:#a2abb8;--line:#2c333e;--head:#0b1a30;--ban:#ff8a80;--banbg:#3a1a18;--talk:#7fcdf5;--talkbg:#12303f;--done:#7fdc9f;--donebg:#14301f;--rec:#b7adff;--dec:#ffcf6b;--decbg:#3a2c0c}
[data-color=field]{--c:#1f5fbf}
[data-color=command]{--c:#c2410c}
[data-color=dispatch]{--c:#0f766e}
[data-color=invest]{--c:#6d28d9}
[data-color=ref]{--c:#475569}
html[data-theme=dark] [data-color=field]{--c:#6ea8ff}
html[data-theme=dark] [data-color=command]{--c:#ff9a62}
html[data-theme=dark] [data-color=dispatch]{--c:#4fd1c5}
html[data-theme=dark] [data-color=invest]{--c:#b794f6}
html[data-theme=dark] [data-color=ref]{--c:#a0aec0}
*{box-sizing:border-box}
html{scroll-padding-top:116px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
header{position:sticky;top:0;z-index:20;background:var(--head);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px 4px;max-width:760px;margin:0 auto}
.top a.home{flex:1;color:#fff;text-decoration:none;font-weight:700;font-size:15px;line-height:1.3}
.iconbtn{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:8px;min-height:36px;padding:0 12px;font:inherit;font-size:14px;cursor:pointer}
.tabs{display:flex;gap:4px;padding:4px 8px 8px;max-width:760px;margin:0 auto}
.tabs a{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;min-height:42px;padding:2px;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;text-decoration:none;font-size:13px;font-weight:700;line-height:1.2}
.tabs a.on{background:#fff;color:#10294a}
main{max-width:760px;margin:0 auto;padding:12px}
.view{display:none}
.view.on{display:block}
.notice{background:var(--banbg);border-left:5px solid var(--ban);border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:14px}
.notice p{margin:4px 0}
h1.ask{font-size:22px;margin:6px 0 10px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.card{display:flex;flex-direction:column;gap:6px;min-height:128px;padding:14px;border-radius:14px;background:var(--c);color:#fff;text-decoration:none}
html[data-theme=dark] .card{color:#10141a}
.card b{font-size:21px;line-height:1.25}
.card span{font-size:14px;line-height:1.4}
.wide{display:block;padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700;margin-bottom:12px}
.search{width:100%;min-height:46px;font:inherit;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
#results{margin:8px 0 14px}
#results a{display:block;padding:10px 12px;margin-bottom:6px;border-radius:8px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:15px}
#results a small{display:block;color:var(--mut);font-size:12px}
.vh{border-left:6px solid var(--c);padding:2px 0 2px 12px;margin-bottom:14px}
.vh h2{margin:0;font-size:24px;line-height:1.3;color:var(--c)}
.vh p{margin:2px 0;font-size:15px;color:var(--mut)}
.vh p.quick{color:var(--ink);margin-top:6px}
.tools{display:flex;gap:6px;margin-top:10px}
.tools button{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;cursor:pointer;padding:0 2px}
.flow{display:flex;flex-direction:column}
.arrow{align-self:center;width:3px;height:22px;background:var(--c);position:relative;margin:0 0 8px}
.arrow::after{content:"";position:absolute;left:-6px;bottom:-8px;border:7.5px solid transparent;border-top:9px solid var(--c);border-bottom:0}
.node{background:var(--card);border:2px solid var(--c);border-radius:12px}
.node.rf{border-width:1px;border-color:var(--line);margin-bottom:8px}
.node>summary{display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:58px;cursor:pointer;list-style:none}
.node>summary::-webkit-details-marker{display:none}
.no{flex:none;width:32px;height:32px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
html[data-theme=dark] .no{color:#10141a}
.tt{flex:1;min-width:0;line-height:1.3}
.tt b{display:block;font-size:17px}
.tt small{display:block;font-size:13.5px;color:var(--mut);margin-top:2px}
.pg{flex:none;font-size:12px;font-weight:700;color:var(--mut)}
.node.full>summary .no{background:var(--done)}
.node.full .pg{color:var(--done)}
.node[open]>summary{border-bottom:1px solid var(--line)}
.nb{padding:10px 12px 12px}
.dec{background:var(--decbg);border:2px dashed var(--dec);border-radius:12px;padding:10px 12px}
.dec .q{margin:0 0 8px;font-weight:700;color:var(--dec);text-align:center}
.dec .q::before{content:"판단 · ";font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dec .chips{margin-top:0}
.chip{flex:1 1 150px;display:block;padding:8px 10px;border-radius:8px;background:var(--card);border:1px solid var(--c);color:var(--ink);text-decoration:none;line-height:1.3}
.chip b{display:block;font-size:14px}
.chip span{display:block;font-size:13px;color:var(--c);font-weight:600}
.chip span::before{content:"→ "}
h4{margin:12px 0 4px;font-size:16px}
.lead{font-weight:600;background:var(--bg);border-radius:8px;padding:8px 12px;margin:8px 0}
.part{border-radius:10px;padding:8px 12px;margin-top:10px}
.part h4{margin:0 0 4px}
.ban{background:var(--banbg)}.ban h4{color:var(--ban)}
.talk{background:var(--talkbg)}.talk h4{color:var(--talk)}
.done{background:var(--donebg)}.done h4{color:var(--done)}
.part p{margin:4px 0}
.radio{border-left:4px solid var(--talk);padding-left:10px;margin:6px 0}
a.ref{color:var(--c);font-weight:700}
ul,ol{margin:6px 0;padding-left:22px}
li{margin:3px 0}
ul.chk{list-style:none;padding:0}
ul.chk li{margin:0;border-bottom:1px solid var(--line)}
ul.chk li:last-child{border-bottom:0}
ul.chk label{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;cursor:pointer;min-height:44px}
ul.chk input{width:24px;height:24px;flex:none;margin:1px 0 0;accent-color:var(--c)}
ul.chk input:checked+span{color:var(--mut);text-decoration:line-through}
ul.chk ul.sub{list-style:disc;margin:-2px 0 8px;padding-left:52px;font-size:15.5px;line-height:1.45}
ul.chk ul.sub li{margin:3px 0;border:0}
.rec{display:inline-block;font-size:11px;font-weight:700;color:var(--rec);border:1px solid var(--rec);border-radius:4px;padding:0 4px;margin-left:2px;vertical-align:1px}
details.law{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:0 12px}
details.law summary{min-height:42px;display:flex;align-items:center;font-weight:700;font-size:14px;cursor:pointer}
details.law li,details.law p{font-size:14.5px}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{border:1px solid var(--line);padding:6px 7px;text-align:left;vertical-align:top}
th{background:var(--bg)}
.now{margin-bottom:20px}
.now h3{margin:0 0 8px;font-size:20px}
.core{margin:0 0 12px;padding:8px 12px;border-radius:8px;background:var(--card);border:1px solid var(--line);font-size:15px;font-weight:700;line-height:1.45}
[data-tone=red]{--t:#b3261e}
[data-tone=amber]{--t:#a84b05}
[data-tone=blue]{--t:#1f5fbf}
[data-tone=green]{--t:#1b6e3c}
html[data-theme=dark] [data-tone=red]{--t:#ff8a80}
html[data-theme=dark] [data-tone=amber]{--t:#ffb35c}
html[data-theme=dark] [data-tone=blue]{--t:#6ea8ff}
html[data-theme=dark] [data-tone=green]{--t:#7fdc9f}
.sitgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbtn{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:74px;padding:8px 12px;border-radius:12px;background:var(--t);color:#fff;text-decoration:none;line-height:1.25}
.sbtn:first-child{grid-column:1/-1;min-height:82px}
.sbtn b{font-size:19px}
.sbtn:first-child b{font-size:23px}
.sbtn span{font-size:13px}
.sbtn.on{outline:3px solid var(--ink);outline-offset:2px}
html[data-theme=dark] .sbtn{color:#10141a}
.draft{margin:6px 0 0;font-size:12.5px;color:var(--mut)}
.sit{margin-top:12px;background:var(--card);border:2px solid var(--t);border-radius:12px;overflow:hidden}
.sit-h{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--t);color:#fff}
html[data-theme=dark] .sit-h{color:#10141a}
.sit-h h3{flex:1;margin:0;font-size:21px;line-height:1.3}
.sit-x{flex:none;display:flex;align-items:center;min-height:36px;padding:0 12px;border-radius:8px;background:rgba(255,255,255,.2);color:inherit;font-size:14px;font-weight:700;text-decoration:none}
.sit-b{padding:8px 12px 12px}
.sit-b .lead{margin-top:2px}
.sit ol{list-style:none;counter-reset:s;margin:6px 0 0;padding:0}
.sit ol li{counter-increment:s;position:relative;min-height:46px;margin:0;padding:8px 0 8px 42px;border-bottom:1px solid var(--line);line-height:1.45}
.sit ol li:last-child{border-bottom:0}
.sit ol li::before{content:counter(s);position:absolute;left:0;top:9px;display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--t);color:#fff;font-weight:700}
html[data-theme=dark] .sit ol li::before{color:#10141a}
.sit ol li strong{display:block;font-size:18px}
h4.next{margin:10px 0 0}
.sit .chips{margin-top:6px}
.cmd{background:var(--decbg)}.cmd h4{color:var(--dec)}
.plain{padding:0;margin-top:12px}
.sit td:first-child{white-space:nowrap;font-weight:700}
.stage{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px;margin:18px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--c)}
.flow>.stage:first-child{margin-top:4px}
.stage b{font-size:18px;color:var(--c)}
.stage span{font-size:13.5px;color:var(--mut)}
.vh h2.h2s{font-size:20px}
.memo{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:2px solid var(--c);box-shadow:0 -2px 8px rgba(0,0,0,.25);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.memo[hidden]{display:none}
.memo-in{max-width:760px;margin:0 auto}
.memo-head{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:40px;padding:0 10px;border:0;border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.memo-head.live{background:var(--ban);color:#fff}
html[data-theme=dark] .memo-head.live{color:#10141a}
.memo-body{margin-top:6px;max-height:calc(100vh - 170px);overflow-y:auto}
.memo-body[hidden]{display:none}
.memo-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media(max-width:620px){.memo-row{grid-template-columns:repeat(2,1fr)}}
.slot{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.slot button{font:inherit;cursor:pointer;border-radius:8px}
.mbtn{min-height:52px;padding:4px 2px;border:2px solid var(--c);background:var(--bg);color:var(--ink);line-height:1.25}
.mbtn b{display:block;font-size:15px}
.mbtn small{display:block;font-size:12px;color:var(--mut)}
.slot.has .mbtn{background:var(--c);color:#fff}
.slot.has .mbtn small{color:#fff}
html[data-theme=dark] .slot.has .mbtn,html[data-theme=dark] .slot.has .mbtn small{color:#10141a}
.slot.recing .mbtn{background:var(--ban);border-color:var(--ban);color:#fff}
.slot.recing .mbtn small{color:#fff}
html[data-theme=dark] .slot.recing .mbtn,html[data-theme=dark] .slot.recing .mbtn small{color:#10141a}
.redo{min-height:34px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px}
.redo[hidden]{display:none}
.memo-foot{display:flex;align-items:center;gap:8px;margin-top:4px}
.memo-foot p{flex:1;margin:0;font-size:12px;line-height:1.35;color:var(--mut)}
.memo-foot p.err{color:var(--ban);font-weight:700}
#memoClear{flex:none;min-height:34px;padding:0 8px;border:1px solid var(--ban);border-radius:8px;background:var(--card);color:var(--ban);font:inherit;font-size:13px;cursor:pointer}
body.memo-on main{padding-bottom:var(--memo-h,70px)}
.memo-stt{margin-top:6px;font-size:13px;line-height:1.35}
.memo-stt[hidden]{display:none}
.memo-stt p{margin:0 0 3px}
.memo-stt .warn{background:var(--banbg);color:var(--ban);font-weight:700;border-radius:6px;padding:3px 6px}
.memo-stt .chk{color:var(--dec);font-weight:700}
.memo-stt .row b{display:block;color:var(--c)}
.memo-stt .ent{display:block;font-size:26px;overflow-wrap:anywhere}
.memo-stt .row[hidden]{display:none}
#sttToggle{flex:none;min-height:34px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
#sttToggle[aria-pressed=true]{background:var(--ban);border-color:var(--ban);color:#fff}
html[data-theme=dark] #sttToggle[aria-pressed=true]{color:#10141a}
.lr{padding:0;border:0;background:none;color:var(--c);font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
#law{width:min(640px,calc(100vw - 16px));max-height:82vh;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
#law::backdrop{background:rgba(0,0,0,.5)}
#law[open]{display:flex;flex-direction:column}
.law-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.law-h b{flex:1;font-size:16px;line-height:1.35}
#lawX{flex:none;min-width:64px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
#lawBody{padding:8px 12px;overflow-y:auto;font-size:16px;line-height:1.6}
#lawBody p{margin:0 0 8px;padding:2px 4px;border-radius:6px}
#lawBody p.hit{background:var(--banbg);font-weight:700}
.law-f{padding:8px 12px;border-top:1px solid var(--line);font-size:13px;line-height:1.4;color:var(--mut)}
.law-f a{color:var(--c);font-weight:700}
@media(max-width:620px){
 .stack thead{display:none}
 .stack,.stack tbody,.stack tr,.stack td{display:block;width:100%}
 .stack tr{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;padding:6px 8px}
 .stack td{border:0;padding:3px 0}
 .stack td:empty{display:none}
 .stack td::before{content:attr(data-h);display:block;font-size:12px;font-weight:700;color:var(--mut)}
}
@media print{
 @page{size:A5;margin:10mm}
 body{background:#fff;color:#000;font-size:10.5pt}
 header,.tools,.search,#results,.memo,.sitgrid,.sit-x,.now h3{display:none!important}
 .sit[hidden]{display:block}
 .sit{break-inside:avoid-page;border-color:#000}
 .sit-h{background:none;color:#000;border-bottom:1px solid #000}
 .sit ol li::before{background:none;color:#000;border:1px solid #000}
 main,body.memo-on main{padding:0;max-width:none}
 .node,.dec{break-inside:avoid-page}
 .arrow{height:10px}
 .part{background:none;border:1px solid #999}
 .lr{color:inherit;font-weight:inherit;text-decoration:none}
}
</style>
</head>
<body>
<header>
 <div class="top">
  <a class="home" href="#home">{{TITLE}}</a>
  <button class="iconbtn" id="theme">야간</button>
 </div>
 <nav class="tabs" aria-label="역할 선택">{{TABS}}<a href="#ref" data-tab="ref">참고</a></nav>
</header>
<main>
 <section class="view" id="home">
  <div class="notice">{{NOTICE}}</div>
  <h1 class="ask">내 역할을 선택하세요</h1>
  <div class="cards">{{CARDS}}</div>
  <a class="wide" href="#ref">참고 자료 · 물리력 기준, 시한표, 무전 순서, 죄명표 등</a>
  <input class="search" id="q" type="search" placeholder="전체 검색: 수갑, 48시간, 전자충격기…" aria-label="매뉴얼 전체 검색">
  <div id="results"></div>
 </section>
 {{VIEWS}}
</main>
 <section class="memo" id="memo" aria-label="출동 음성 메모" hidden>
  <div class="memo-in">
   <button class="memo-head" id="memoHead" type="button" aria-expanded="false" aria-controls="memoBody"><span id="memoStat">음성 메모</span><span id="memoArrow">펼치기 ▲</span></button>
   <div class="memo-body" id="memoBody" hidden>
   <div class="memo-row">
    <div class="slot" data-name="사건위치"><button class="mbtn" type="button"><b>사건위치</b><small>눌러서 녹음</small></button><button class="redo" type="button" hidden>다시 녹음</button></div>
    <div class="slot" data-name="인상착의"><button class="mbtn" type="button"><b>인상착의</b><small>눌러서 녹음</small></button><button class="redo" type="button" hidden>다시 녹음</button></div>
    <div class="slot" data-name="도주경로"><button class="mbtn" type="button"><b>도주경로</b><small>눌러서 녹음</small></button><button class="redo" type="button" hidden>다시 녹음</button></div>
    <div class="slot" data-name="특이사항"><button class="mbtn" type="button"><b>특이사항</b><small>눌러서 녹음</small></button><button class="redo" type="button" hidden>다시 녹음</button></div>
   </div>
   <div class="memo-stt" id="memoStt" hidden>
    <p class="warn" id="sttWarn">주의: 음성이 외부서버로 전송됩니다. 개인정보 입력금지</p>
    <p class="chk">자동 변환, 확인 필요. 원본 음성을 들어 확인하세요.</p>
   </div>
   <div class="memo-foot"><p id="memoMsg"></p><button id="sttToggle" type="button" aria-pressed="false">글자 변환</button><button id="memoClear" type="button">전체 삭제</button></div>
   </div>
  </div>
 </section>
<dialog id="law" aria-labelledby="lawT"><div class="law-h"><b id="lawT"></b><button id="lawX" type="button">닫기</button></div><div id="lawBody"></div><p class="law-f" style="margin:0"><span id="lawD"></span> <a id="lawU" target="_blank" rel="noopener">법령 사이트에서 보기</a></p></dialog>
<script type="application/json" id="lawData">{{LAWS}}</script>
<script>
(function(){
 var KEY='weapon-manual-v4',mem={};
 function get(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return mem[k]===undefined?d:mem[k]}}
 function set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}
 function $$(s,r){return [].slice.call((r||document).querySelectorAll(s))}
 var checks=JSON.parse(get(KEY,'{}'));

 function progress(node){
  var bs=$$('input[type=checkbox]',node),pg=node.querySelector('.pg');
  if(!pg||!bs.length)return;
  var n=bs.filter(function(b){return b.checked}).length;
  pg.textContent=n+'/'+bs.length;
  node.classList.toggle('full',n===bs.length);
 }
 $$('input[type=checkbox]').forEach(function(b){
  b.checked=!!checks[b.dataset.id];
  b.addEventListener('change',function(){
   if(b.checked)checks[b.dataset.id]=1;else delete checks[b.dataset.id];
   set(KEY,JSON.stringify(checks));progress(b.closest('.node'));
  });

 var memo=document.getElementById('memo'),memoMsg=document.getElementById('memoMsg');
 var MEMO_TIP='본인 확인용 메모. 동승자가 본인 목소리로 핵심만 녹음. 무전·대화는 녹음하지 않음. 저장되지 않고 화면을 닫으면 삭제됩니다. 마이크 권한 창에서는 이번만 허용이 아니라 사이트 방문 시 허용을 고르세요.';
 var rec=null,asking=false,playing=null,player=new Audio(),mic=null,wake=null,onField=false;
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition,stt=!!SR&&get('weapon-stt','1')!=='0',MOBILE=/Android|iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform));
 var sttBox=document.getElementById('memoStt'),sttWarn=document.getElementById('sttWarn'),sttBtn=document.getElementById('sttToggle');
 var slots=$$('.slot',memo).map(function(el){return {el:el,name:el.dataset.name,main:el.querySelector('.mbtn'),redo:el.querySelector('.redo'),url:null,sec:0,at:''}});
 var memoHead=document.getElementById('memoHead'),memoBody=document.getElementById('memoBody'),memoStat=document.getElementById('memoStat'),memoArrow=document.getElementById('memoArrow');
 function hhmm(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
 function paintHead(){
  var a=0,t=0;
  slots.forEach(function(s){if(s.url)a++;t+=s.entries.length});
  memoStat.textContent=rec?'● '+rec.slot.name+(rec.textOnly?' 글자 변환 중 ':' 녹음 중 ')+rec.sec+'초':'음성 메모'+(a||t?' (음성 '+a+' · 글자 '+t+')':'');

 function keepAwake(){
  if(wake||document.hidden||!navigator.wakeLock)return;

   if(wake||!rec){w.release();return}

 function say(t,err){memoMsg.textContent=t||MEMO_TIP;memoMsg.classList.toggle('err',!!err);if(err&&memoBody.hidden)setOpen(true)}
 slots.forEach(function(s){
  s.entries=[];s.row=document.createElement('div');s.row.className='row';s.row.hidden=true;
  var b=document.createElement('b');b.textContent=s.name;s.out=document.createElement('div');
  s.row.appendChild(b);s.row.appendChild(s.out);sttBox.appendChild(s.row);
 });
 function paintText(){
  var any=false;
  slots.forEach(function(s){
   s.out.textContent='';
   s.entries.forEach(function(e){
    if(!e.text)return;
    var d=document.createElement('span');d.className='ent';d.textContent=e.at+' '+e.text;s.out.appendChild(d);any=true;
   });
   s.row.hidden=!s.out.firstChild;
  });

 function sttFollow(r){
  var l=r.slot.out.lastChild;if(!l)return;
  var b=l.getBoundingClientRect(),m=memoBody.getBoundingClientRect(),d=b.bottom-m.bottom;
  if(d>0||b.bottom<m.top)memoBody.scrollTop+=d;
 }
 function sttStart(r){
  if(!stt||!SR)return;
  var x=new SR();
  x.lang='ko-KR';x.continuous=!r.textOnly;x.interimResults=true;
  r.sr=x;r.final='';r.entry={at:hhmm(),text:''};r.slot.entries.push(r.entry);
  function done(){
   if(r.track)r.track.stop();
   if(!r.entry.text){
    var i=r.slot.entries.indexOf(r.entry);
    if(i>=0)r.slot.entries.splice(i,1);
    if(!r.dead&&!r.sttFail)say('인식된 글자가 없습니다.',true);
   }
   paintText();paint(r.slot);
  }
  var t0=0,quick=0,bad=false;
  function again(){if(rec===r&&stt&&!r.sttFail)begin();else x.onend()}
  function begin(){
   t0=Date.now();
   try{x.start(r.track)}catch(e){
    try{x.start()}catch(e2){quick++;setTimeout(again,1000)}
   }
  }
  x.onresult=function(e){
   var mid='';
   for(var i=e.resultIndex;i<e.results.length;i++){
    var t=e.results[i][0].transcript;
    if(e.results[i].isFinal)r.final+=t+' ';else mid+=t;
   }
   r.mid=mid;
   if(quick>=3){quick=0;say(r.slot.name+' 글자 변환 다시 연결됨.')}
   if(!r.dead){r.entry.text=(r.final+mid).trim();paintText();sttFollow(r)}
  };
  x.onerror=function(e){
   if(e.error==='no-speech'||e.error==='aborted')return;
   if(e.error!=='not-allowed'&&e.error!=='service-not-allowed'&&e.error!=='language-not-supported'){bad=true;return}
   r.sttFail=true;say('글자 변환에 실패했습니다('+e.error+').'+(r.textOnly?'':' 녹음은 계속됩니다.'),true);
  };
  x.onend=function(){
   if(r.mid){r.final+=r.mid+' ';r.mid=''}
   if(rec===r&&stt&&!r.sttFail){
    if(document.hidden){r.resume=again;return}
    quick=bad||Date.now()-t0<500?quick+1:0;bad=false;
    if(quick>=3)say('글자 변환 연결이 끊겨 다시 시도하는 중입니다.',true);
    if(quick)setTimeout(again,Math.min(quick,5)*1000);else begin();
    return;
   }
   if(r.textOnly){
    if(rec===r){clearInterval(r.timer);rec=null}
    done();paint(r.slot);
    if(!r.sttFail&&!r.dead&&r.entry.text)say(r.slot.name+' 글자 변환 완료. 음성은 녹음되지 않았습니다.');
    return;
   }
   done();
  };
  begin();
 }
 function sttStop(r,discard){
  if(!r.sr||r.sttFail)return;
  if(discard){r.dead=true;r.sr.abort()}else r.sr.stop();
 }
 function paint(s){
  var small=s.main.querySelector('small'),now=rec&&rec.slot===s;
  s.el.classList.toggle('recing',!!now);s.el.classList.toggle('has',!!s.url&&!now);
  s.redo.hidden=!s.url||!!now;s.redo.textContent=stt&&SR&&MOBILE?'글자 추가':'다시 녹음';
  if(now)small.textContent='● '+(rec.textOnly?'변환':'녹음')+' 중 '+rec.sec+'초 · 눌러서 끝';
  else if(playing===s)small.textContent='재생 중 · 눌러서 정지';
  else if(s.url)small.textContent='▶ '+s.at+' · '+s.sec+'초';
  else if(s.entries.length)small.textContent='글자 '+s.entries.length+'건 · 눌러서 추가';
  else small.textContent=stt&&SR&&MOBILE?'눌러서 글자 변환':'눌러서 녹음';
  paintHead();
 }
 function stopPlay(){var s=playing;playing=null;player.pause();if(s)paint(s)}
 function endRec(discard){
  if(!rec)return;
  var r=rec;r.discard=!!discard;clearInterval(r.timer);rec=null;paint(r.slot);sttStop(r,discard);
  if(r.mr&&r.mr.state!=='inactive')r.mr.stop();
 }
 function tick(r){r.sec=Math.floor((Date.now()-r.t0)/1000);paint(r.slot)}
 function micOn(on){if(mic)mic.getAudioTracks().forEach(function(t){t.enabled=on})}
 function releaseMic(){if(mic){mic.getTracks().forEach(function(t){t.stop()});mic=null}}
 function getMic(){
  if(mic&&mic.getAudioTracks().some(function(t){return t.readyState==='live'}))return Promise.resolve(mic);
  releaseMic();
  return navigator.mediaDevices.getUserMedia({audio:true}).then(function(m){mic=m;return m});
 }
 function startRec(s){
  if(rec){var same=rec.slot===s;endRec();if(same)return}
  if(asking)return;
  stopPlay();
  if(stt&&SR&&MOBILE){
   releaseMic();
   var t={mr:null,slot:s,sec:0,t0:Date.now(),discard:false,textOnly:true};
   rec=t;say(s.name+' 글자 변환 중. 다시 누르면 끝납니다.');paint(s);
   t.timer=setInterval(function(){tick(t)},1000);
   sttStart(t);
   return;
  }
  if(!window.MediaRecorder||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){say('이 브라우저에서는 녹음을 쓸 수 없습니다.',true);return}
  asking=true;
  getMic().then(function(stream){
   asking=false;micOn(true);
   var mr=new MediaRecorder(stream),chunks=[],r={mr:mr,slot:s,sec:0,t0:Date.now(),discard:false};
   mr.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
   mr.onstop=function(){
    var lost=rec===r;
    if(lost){clearInterval(r.timer);rec=null;sttStop(r,true)}
    if(!rec)micOn(false);
    if(!r.discard&&chunks.length){
     if(s.url)URL.revokeObjectURL(s.url);
     var d=new Date();
     s.url=URL.createObjectURL(new Blob(chunks,{type:mr.mimeType||'audio/webm'}));
     s.sec=Math.max(1,r.sec);s.at=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
     if(lost)say(s.name+' 마이크가 끊겨 녹음이 멈췄습니다. 여기까지는 남아 있습니다.',true);
     else if(!rec)say(s.name+' 녹음 완료. 누르면 다시 들을 수 있습니다.');
    }else if(!r.discard)say('녹음된 내용이 없습니다. 다시 녹음하세요.',true);
    paint(s);
   };
   mr.start();rec=r;say(s.name+' 녹음 중. 다시 누르면 끝납니다.');paint(s);
   if(stt&&SR){r.track=stream.getAudioTracks()[0].clone();sttStart(r)}
   r.timer=setInterval(function(){tick(r)},1000);
  }).catch(function(e){asking=false;say('마이크를 쓸 수 없습니다('+e.name+'). 브라우저의 마이크 권한을 확인하세요.',true)});
 }

  var p=player.play();
  if(p&&p.catch)p.catch(function(){if(playing===s){stopPlay();say('재생할 수 없습니다.',true)}});
