<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>{{TITLE}}</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14181f;--mut:#5b6472;--line:#d9dde3;--brand:#123a6b;--brandink:#fff;--ban:#b3261e;--banbg:#fdecea;--talk:#0b5d8a;--talkbg:#e6f3fa;--done:#1b6e3c;--donebg:#e8f5ec;--rec:#6a5acd}
html[data-theme=dark]{--bg:#0e1116;--card:#171b22;--ink:#e9ecf1;--mut:#a2abb8;--line:#2c333e;--brand:#1c4f8f;--brandink:#fff;--ban:#ff8a80;--banbg:#3a1a18;--talk:#7fcdf5;--talkbg:#12303f;--done:#7fdc9f;--donebg:#14301f;--rec:#b7adff}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:112px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
header{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brandink);padding:8px 12px calc(8px);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.top{display:flex;align-items:center;gap:8px}
.top h1{flex:1;margin:0;font-size:16px;line-height:1.3}
.iconbtn{background:rgba(255,255,255,.16);color:inherit;border:0;border-radius:8px;min-height:40px;padding:0 12px;font:inherit;font-size:14px;cursor:pointer}
.roles{display:flex;gap:6px;margin-top:8px}
.roles button{flex:1;min-height:40px;border:0;border-radius:8px;background:rgba(255,255,255,.16);color:inherit;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.roles button[aria-pressed=true]{background:#fff;color:#123a6b}
.layout{display:flex;max-width:1180px;margin:0 auto}
nav{position:sticky;top:104px;align-self:flex-start;width:250px;flex:none;max-height:calc(100vh - 112px);overflow:auto;padding:12px 8px}
nav a{display:block;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.35}
nav a b{display:block;font-size:12px;color:var(--mut);font-weight:600}
nav a.on{background:var(--brand);color:#fff}
nav a.on b{color:#dfe7f2}
main{flex:1;min-width:0;padding:12px}
.notice{background:var(--banbg);color:var(--ink);border-left:5px solid var(--ban);border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:12px}
.notice p{margin:4px 0}
.search{width:100%;min-height:44px;font:inherit;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-bottom:12px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px}
h2{margin:0 0 6px;font-size:23px;line-height:1.3}
h2 small{display:block;font-size:13px;color:var(--mut);font-weight:600}
h3{margin:0 0 8px;font-size:18px}
.lead{font-weight:600;background:var(--bg);border-radius:8px;padding:10px 12px;margin:8px 0 14px}
.sub{margin-top:16px}
.ban{background:var(--banbg);border-radius:10px;padding:12px}
.ban h3{color:var(--ban)}
.talk{background:var(--talkbg);border-radius:10px;padding:12px}
.talk h3{color:var(--talk)}
.done{background:var(--donebg);border-radius:10px;padding:12px}
.done h3{color:var(--done)}
.radio{border-left:4px solid var(--talk);padding-left:10px;margin:8px 0}
ul,ol{margin:6px 0;padding-left:22px}
li{margin:4px 0}
ul.chk{list-style:none;padding:0}
ul.chk li{margin:0;border-bottom:1px solid var(--line)}
ul.chk li:last-child{border-bottom:0}
ul.chk label{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;cursor:pointer;min-height:44px}
ul.chk input{width:24px;height:24px;flex:none;margin:1px 0 0;accent-color:var(--brand)}
ul.chk input:checked+span{color:var(--mut);text-decoration:line-through}
.rec{display:inline-block;font-size:11px;font-weight:700;color:var(--rec);border:1px solid var(--rec);border-radius:4px;padding:0 4px;margin-left:2px;vertical-align:1px;text-decoration:none}
details.law{margin-top:16px;border:1px solid var(--line);border-radius:10px;padding:0 12px}
details.law summary{min-height:44px;display:flex;align-items:center;font-weight:700;cursor:pointer}
details.law[open]{padding-bottom:10px}
details.law li,details.law p{font-size:15px}
.tw{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:var(--bg)}
.hide{display:none!important}
.sticky-tools{display:flex;gap:8px;margin:0 0 12px}
.sticky-tools button{flex:1;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
#menu{display:none}
mark{background:#ffe27a;color:#000}
@media(max-width:860px){
 nav{display:none;position:fixed;inset:104px 0 0 0;width:auto;max-height:none;background:var(--bg);z-index:15;padding:10px}
 nav.open{display:block}
 #menu{display:inline-block}
 nav a{padding:12px;font-size:16px}
 table{font-size:14px}
 th,td{padding:6px}
 .stack thead{display:none}
 .stack,.stack tbody,.stack tr,.stack td{display:block;width:100%}
 .stack tr{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;padding:6px 8px}
 .stack td{border:0;padding:3px 0}
 .stack td::before{content:attr(data-h);display:block;font-size:12px;font-weight:700;color:var(--mut)}
}
@media print{
 @page{size:A5;margin:10mm}
 body{background:#fff;color:#000;font-size:10.5pt}
 header,nav,.search,.sticky-tools{display:none!important}
 .layout{display:block}
 main{padding:0}
 section{border:0;padding:0;break-before:page}
 details.law{border:0;padding:0}
 details.law>*{display:block}
 [data-role].hide{display:block!important}
 .ban,.talk,.done{background:none;border:1px solid #999}
}
</style>
</head>
<body>
<header>
 <div class="top">
  <button class="iconbtn" id="menu" aria-expanded="false" aria-controls="nav">목차</button>
  <h1>{{TITLE}}</h1>
  <button class="iconbtn" id="theme">야간</button>
 </div>
 <div class="roles" role="group" aria-label="역할 선택">
  <button data-r="all" aria-pressed="true">전체</button>
  <button data-r="field" aria-pressed="false">현장</button>
  <button data-r="dispatch" aria-pressed="false">상황실</button>
  <button data-r="command" aria-pressed="false">지휘관</button>
 </div>
</header>
<div class="layout">
 <nav id="nav" aria-label="목차">{{NAV}}</nav>
 <main>
  <div class="notice">{{NOTICE}}</div>
  <input class="search" id="q" type="search" placeholder="검색: 수갑, 48시간, 전자충격기…" aria-label="매뉴얼 검색">
  <div class="sticky-tools">
   <button id="reset">체크 초기화</button>
   <button id="print">인쇄 (A5)</button>
  </div>
  <p id="none" class="hide">검색 결과가 없습니다.</p>
  {{BODY}}
 </main>
</div>
<script>
(function(){
 var KEY='weapon-manual-v1', store={};
 function get(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return store[k]===undefined?d:store[k]}}
 function set(k,v){try{localStorage.setItem(k,v)}catch(e){store[k]=v}}
 var checks=JSON.parse(get(KEY,'{}'));
 var boxes=document.querySelectorAll('input[type=checkbox]');
 boxes.forEach(function(b){
  b.checked=!!checks[b.dataset.id];
  b.addEventListener('change',function(){if(b.checked)checks[b.dataset.id]=1;else delete checks[b.dataset.id];set(KEY,JSON.stringify(checks))});
 });
 document.getElementById('reset').onclick=function(){checks={};set(KEY,'{}');boxes.forEach(function(b){b.checked=false})};
 document.getElementById('print').onclick=function(){document.querySelectorAll('details').forEach(function(d){d.open=true});window.print()};

 var theme=document.getElementById('theme');
 function applyTheme(t){document.documentElement.dataset.theme=t;theme.textContent=t==='dark'?'주간':'야간';set('weapon-theme',t)}
 applyTheme(get('weapon-theme',matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
 theme.onclick=function(){applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')};

 var roleBtns=document.querySelectorAll('.roles button');
 function applyRole(r){
  roleBtns.forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.r===r))});
  document.querySelectorAll('[data-role]').forEach(function(el){el.classList.toggle('hide',r!=='all'&&el.dataset.role!==r)});
  set('weapon-role',r);
 }
 roleBtns.forEach(function(b){b.onclick=function(){applyRole(b.dataset.r)}});
 applyRole(get('weapon-role','all'));

 var nav=document.getElementById('nav'),menu=document.getElementById('menu');
 menu.onclick=function(){var o=nav.classList.toggle('open');menu.setAttribute('aria-expanded',String(o))};
 nav.addEventListener('click',function(e){if(e.target.closest('a')){nav.classList.remove('open');menu.setAttribute('aria-expanded','false')}});

 var links={};document.querySelectorAll('nav a').forEach(function(a){links[a.dataset.sec]=a});
 var secs=document.querySelectorAll('section');
 if('IntersectionObserver' in window){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){Object.keys(links).forEach(function(k){links[k].classList.toggle('on',k===e.target.id)})}})},{rootMargin:'-20% 0px -70% 0px'});
  secs.forEach(function(s){io.observe(s)});
 }

 var q=document.getElementById('q'),none=document.getElementById('none');
 q.addEventListener('input',function(){
  var t=q.value.trim().toLowerCase(),hits=0;
  secs.forEach(function(s){
   if(!t){s.classList.remove('hide');s.querySelectorAll('details').forEach(function(d){d.open=false});return}
   var found=s.textContent.toLowerCase().indexOf(t)>=0;
   s.classList.toggle('hide',!found);
   if(found){hits++;s.querySelectorAll('details').forEach(function(d){if(d.textContent.toLowerCase().indexOf(t)>=0)d.open=true})}
  });
  none.classList.toggle('hide',!t||hits>0);
 });
})();
</script>
</body>
</html>
