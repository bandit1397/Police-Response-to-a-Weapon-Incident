<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>{{TITLE}}</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#14181f;--mut:#5b6472;--line:#d6dbe2;--head:#10294a;--ban:#b3261e;--banbg:#fdecea;--talk:#0b5d8a;--talkbg:#e6f3fa;--done:#1b6e3c;--donebg:#e8f5ec;--rec:#5b4bc4;--dec:#8a5a00;--decbg:#fff4d6;--c:#1f5fbf}
html[data-theme=dark]{--bg:#0e1116;--card:#171b22;--ink:#e9ecf1;--mut:#a2abb8;--line:#2c333e;--head:#0b1a30;--ban:#ff8a80;--banbg:#3a1a18;--talk:#7fcdf5;--talkbg:#12303f;--done:#7fdc9f;--donebg:#14301f;--rec:#b7adff;--dec:#ffcf6b;--decbg:#3a2c0c}
[data-color=field]{--c:#1f5fbf}
[data-color=command]{--c:#c2410c}
[data-color=dispatch]{--c:#0f766e}
[data-color=invest]{--c:#6d28d9}
[data-color=ref]{--c:#475569}
html[data-theme=dark] [data-color=field]{--c:#6ea8ff}
html[data-theme=dark] [data-color=command]{--c:#ff9a62}
html[data-theme=dark] [data-color=dispatch]{--c:#4fd1c5}
html[data-theme=dark] [data-color=invest]{--c:#b794f6}
html[data-theme=dark] [data-color=ref]{--c:#a0aec0}
*{box-sizing:border-box}
html{scroll-padding-top:116px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
header{position:sticky;top:0;z-index:20;background:var(--head);color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px 4px;max-width:760px;margin:0 auto}
.top a.home{flex:1;color:#fff;text-decoration:none;font-weight:700;font-size:15px;line-height:1.3}
.iconbtn{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:8px;min-height:36px;padding:0 12px;font:inherit;font-size:14px;cursor:pointer}
.tabs{display:flex;gap:4px;padding:4px 8px 8px;max-width:760px;margin:0 auto}
.tabs a{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;min-height:42px;padding:2px;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;text-decoration:none;font-size:13px;font-weight:700;line-height:1.2}
.tabs a.on{background:#fff;color:#10294a}
main{max-width:760px;margin:0 auto;padding:12px}
.view{display:none}
.view.on{display:block}
.notice{background:var(--banbg);border-left:5px solid var(--ban);border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:14px}
.notice p{margin:4px 0}
h1.ask{font-size:22px;margin:6px 0 10px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.card{display:flex;flex-direction:column;gap:6px;min-height:128px;padding:14px;border-radius:14px;background:var(--c);color:#fff;text-decoration:none}
html[data-theme=dark] .card{color:#10141a}
.card b{font-size:21px;line-height:1.25}
.card span{font-size:14px;line-height:1.4}
.wide{display:block;padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700;margin-bottom:12px}
.search{width:100%;min-height:46px;font:inherit;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
#results{margin:8px 0 14px}
#results a{display:block;padding:10px 12px;margin-bottom:6px;border-radius:8px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:15px}
#results a small{display:block;color:var(--mut);font-size:12px}
.vh{border-left:6px solid var(--c);padding:2px 0 2px 12px;margin-bottom:14px}
.vh h2{margin:0;font-size:24px;line-height:1.3;color:var(--c)}
.vh p{margin:2px 0;font-size:15px;color:var(--mut)}
.vh p.quick{color:var(--ink);margin-top:6px}
.tools{display:flex;gap:6px;margin-top:10px}
.tools button{flex:1;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;cursor:pointer;padding:0 2px}
.flow{display:flex;flex-direction:column}
.arrow{align-self:center;width:3px;height:22px;background:var(--c);position:relative;margin:0 0 8px}
.arrow::after{content:"";position:absolute;left:-6px;bottom:-8px;border:7.5px solid transparent;border-top:9px solid var(--c);border-bottom:0}
.node{background:var(--card);border:2px solid var(--c);border-radius:12px;scroll-margin-top:116px}
.node.rf{border-width:1px;border-color:var(--line);margin-bottom:8px}
.node>summary{display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:58px;cursor:pointer;list-style:none}
.node>summary::-webkit-details-marker{display:none}
.no{flex:none;width:32px;height:32px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
html[data-theme=dark] .no{color:#10141a}
.tt{flex:1;min-width:0;line-height:1.3}
.tt b{display:block;font-size:17px}
.tt small{display:block;font-size:13.5px;color:var(--mut);margin-top:2px}
.pg{flex:none;font-size:12px;font-weight:700;color:var(--mut)}
.node.full>summary .no{background:var(--done)}
.node.full .pg{color:var(--done)}
.node[open]>summary{border-bottom:1px solid var(--line)}
.nb{padding:10px 12px 12px}
.dec{background:var(--decbg);border:2px dashed var(--dec);border-radius:12px;padding:10px 12px;scroll-margin-top:116px}
.dec .q{margin:0 0 8px;font-weight:700;color:var(--dec);text-align:center}
.dec .q::before{content:"판단 · ";font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dec .chips{margin-top:0}
.chip{flex:1 1 150px;display:block;padding:8px 10px;border-radius:8px;background:var(--card);border:1px solid var(--c);color:var(--ink);text-decoration:none;line-height:1.3}
.chip b{display:block;font-size:14px}
.chip span{display:block;font-size:13px;color:var(--c);font-weight:600}
.chip span::before{content:"→ "}
h4{margin:12px 0 4px;font-size:16px}
.lead{font-weight:600;background:var(--bg);border-radius:8px;padding:8px 12px;margin:8px 0}
.part{border-radius:10px;padding:8px 12px;margin-top:10px}
.part h4{margin:0 0 4px}
.ban{background:var(--banbg)}.ban h4{color:var(--ban)}
.talk{background:var(--talkbg)}.talk h4{color:var(--talk)}
.done{background:var(--donebg)}.done h4{color:var(--done)}
.part p{margin:4px 0}
.radio{border-left:4px solid var(--talk);padding-left:10px;margin:6px 0}
a.ref{color:var(--c);font-weight:700}
ul,ol{margin:6px 0;padding-left:22px}
li{margin:3px 0}
ul.chk{list-style:none;padding:0}
ul.chk li{margin:0;border-bottom:1px solid var(--line)}
ul.chk li:last-child{border-bottom:0}
ul.chk label{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;cursor:pointer;min-height:44px}
ul.chk input{width:24px;height:24px;flex:none;margin:1px 0 0;accent-color:var(--c)}
ul.chk input:checked+span{color:var(--mut);text-decoration:line-through}
.rec{display:inline-block;font-size:11px;font-weight:700;color:var(--rec);border:1px solid var(--rec);border-radius:4px;padding:0 4px;margin-left:2px;vertical-align:1px}
details.law{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:0 12px}
details.law summary{min-height:42px;display:flex;align-items:center;font-weight:700;font-size:14px;cursor:pointer}
details.law li,details.law p{font-size:14.5px}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{border:1px solid var(--line);padding:6px 7px;text-align:left;vertical-align:top}
th{background:var(--bg)}
@media(max-width:620px){
 .stack thead{display:none}
 .stack,.stack tbody,.stack tr,.stack td{display:block;width:100%}
 .stack tr{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;padding:6px 8px}
 .stack td{border:0;padding:3px 0}
 .stack td:empty{display:none}
 .stack td::before{content:attr(data-h);display:block;font-size:12px;font-weight:700;color:var(--mut)}
}
@media print{
 @page{size:A5;margin:10mm}
 body{background:#fff;color:#000;font-size:10.5pt}
 header,.tools,.search,#results{display:none!important}
 main{padding:0;max-width:none}
 .node,.dec{break-inside:avoid-page}
 .arrow{height:10px}
 .part{background:none;border:1px solid #999}
}
</style>
</head>
<body>
<header>
 <div class="top">
  <a class="home" href="#home">{{TITLE}}</a>
  <button class="iconbtn" id="theme">야간</button>
 </div>
 <nav class="tabs" aria-label="역할 선택">{{TABS}}<a href="#ref" data-tab="ref">참고</a></nav>
</header>
<main>
 <section class="view" id="home">
  <div class="notice">{{NOTICE}}</div>
  <h1 class="ask">내 역할을 선택하세요</h1>
  <div class="cards">{{CARDS}}</div>
  <a class="wide" href="#ref">참고 자료 · 물리력 기준, 시한표, 무전 순서, 죄명표 등</a>
  <input class="search" id="q" type="search" placeholder="전체 검색: 수갑, 48시간, 전자충격기…" aria-label="매뉴얼 전체 검색">
  <div id="results"></div>
 </section>
 {{VIEWS}}
</main>
<script>
(function(){
 var KEY='weapon-manual-v3',mem={};
 function get(k,d){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){return mem[k]===undefined?d:mem[k]}}
 function set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}
 function $$(s,r){return [].slice.call((r||document).querySelectorAll(s))}
 var checks=JSON.parse(get(KEY,'{}'));

 function progress(node){
  var bs=$$('input[type=checkbox]',node),pg=node.querySelector('.pg');
  if(!pg||!bs.length)return;
  var n=bs.filter(function(b){return b.checked}).length;
  pg.textContent=n+'/'+bs.length;
  node.classList.toggle('full',n===bs.length);
 }
 $$('input[type=checkbox]').forEach(function(b){
  b.checked=!!checks[b.dataset.id];
  b.addEventListener('change',function(){
   if(b.checked)checks[b.dataset.id]=1;else delete checks[b.dataset.id];
   set(KEY,JSON.stringify(checks));progress(b.closest('.node'));
  });
 });
 $$('.node').forEach(progress);

 $$('.tools button').forEach(function(btn){
  btn.onclick=function(){
   var view=btn.closest('.view'),nodes=$$('details.node',view),act=btn.dataset.act;
   if(act==='open')nodes.forEach(function(d){d.open=true});
   if(act==='close')nodes.forEach(function(d){d.open=false});
   if(act==='reset'){$$('input[type=checkbox]',view).forEach(function(b){b.checked=false;delete checks[b.dataset.id]});set(KEY,JSON.stringify(checks));nodes.forEach(progress)}
   if(act==='print'){$$('details',view).forEach(function(d){d.open=true});window.print()}
  };
 });

 var theme=document.getElementById('theme');
 function applyTheme(t){document.documentElement.dataset.theme=t;theme.textContent=t==='dark'?'주간':'야간';set('weapon-theme',t)}
 applyTheme(get('weapon-theme',matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
 theme.onclick=function(){applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')};

 function route(){
  var id=decodeURIComponent(location.hash.slice(1))||'home';
  var el=document.getElementById(id);
  if(!el)el=document.getElementById('home');
  var view=el.classList.contains('view')?el:el.closest('.view');
  $$('.view').forEach(function(v){v.classList.toggle('on',v===view)});
  $$('.tabs a').forEach(function(a){a.classList.toggle('on',a.dataset.tab===view.id)});
  if(el===view){window.scrollTo(0,0);return}
  if(el.tagName==='DETAILS')el.open=true;
  el.scrollIntoView();
 }
 window.addEventListener('hashchange',route);
 route();

 var items=$$('details.node,.dec').map(function(n){
  var v=n.closest('.view');
  return {id:n.id,text:n.textContent.toLowerCase(),title:(n.querySelector('.tt b')||n.querySelector('.q')).textContent,role:v.querySelector('h2').textContent};
 });
 var q=document.getElementById('q'),res=document.getElementById('results');
 q.addEventListener('input',function(){
  var t=q.value.trim().toLowerCase();res.textContent='';
  if(!t)return;
  var hits=items.filter(function(i){return i.text.indexOf(t)>=0});
  if(!hits.length){res.textContent='검색 결과가 없습니다.';return}
  hits.slice(0,30).forEach(function(i){
   var a=document.createElement('a');a.href='#'+i.id;
   var s=document.createElement('small');s.textContent=i.role;
   a.appendChild(s);a.appendChild(document.createTextNode(i.title));res.appendChild(a);
  });
 });
})();
</script>
</body>
</html>
